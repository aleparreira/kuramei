name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # UOW Gate — warning-only (NEXT-5)
      # Reads uow-report.json if present; skips silently if absent.
      # Switch to --enforce after warning week: update this step and remove the comment.
      - name: UOW Gate (warning-only)
        run: pnpm uow-gate
        # To activate enforce mode, change the line above to:
        # run: pnpm uow-gate --enforce
